name: Public build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Audit, test and build public artifacts
        shell: powershell
        run: ./scripts/Publish-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PaperFlow-public
          path: artifacts/release-*/*
          if-no-files-found: error
          # Build artifacts are free for public repositories, but they add up (about 80 MB
          # per run). A week is enough to inspect a build; the release itself lives in the
          # Releases page, which has its own (separate) storage.
          retention-days: 7
